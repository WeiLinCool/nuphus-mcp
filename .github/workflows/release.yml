name: Release

# Build the nuphus-mcp binary for all supported platforms on tag push,
# bundle each into its npm platform package, publish to npm, and attach the
# tarballs to a GitHub Release.
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0
#
# Secrets required in the repo:
#   NUPHUS_MCP_NPM  — npm publish token (user "nuphus")
# The GitHub Release uses the workflow's auto-generated GITHUB_TOKEN
# (contents:write is enough to create a Release), so no GH secret needed.

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_dir: npm/packages/nuphus-mcp-win32-x64
            artifact: nuphus-mcp-win32-x64
            native_libs: "onnxruntime.dll onnxruntime_providers_shared.dll"
          - name: win32-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            pkg_dir: npm/packages/nuphus-mcp-win32-arm64
            artifact: nuphus-mcp-win32-arm64
            native_libs: "onnxruntime.dll onnxruntime_providers_shared.dll"
            # x64-host → arm64-target MSVC link.exe is unreliable on runners
            # (VsDevCmd arm64 gives native HostARM64, which can't run on x64).
            # lld-link (shipped with the runner) links ARM64 from a single
            # x64 binary; LIB/INCLUDE still point at the ARM64 CRT via msvc-dev-cmd.
            rustflags: "-C linker=lld-link"
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_dir: npm/packages/nuphus-mcp-linux-x64
            artifact: nuphus-mcp-linux-x64
            native_libs: "libonnxruntime.so libonnxruntime_providers_shared.so"
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_dir: npm/packages/nuphus-mcp-linux-arm64
            artifact: nuphus-mcp-linux-arm64
            native_libs: "libonnxruntime.so libonnxruntime_providers_shared.so"
          - name: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            pkg_dir: npm/packages/nuphus-mcp-osx-arm64
            artifact: nuphus-mcp-osx-arm64
            native_libs: "libonnxruntime.dylib"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # macos-latest's fleet can mix x86_64 and arm64 runners; a cache
          # written by one arch and restored on the other makes host build
          # scripts fail with "cannot execute binary file". Scope the cache
          # per runner arch + target so the two never share artifacts.
          key: ${{ runner.arch }}-${{ matrix.target }}

      # Linux system deps for the C-FFI crates in the tree (openssl-sys,
      # wayland-sys, xcb, xkbcommon, enigo, xcap). apt-get update is flaky on
      # GitHub runners, so retry it a few times before giving up.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          CROSS=false
          [ "${{ matrix.name }}" = "linux-arm64" ] && CROSS=true
          if $CROSS; then
            sudo dpkg --add-architecture arm64
            # Ubuntu 24.04's default deb822 source (ubuntu.sources) has no arch
            # filter, so after --add-architecture apt tries to fetch binary-arm64
            # indexes from archive/security (404 → update fails every retry).
            # Restrict the default source to amd64 so arm64 indexes come only
            # from the ports source below.
            sudo sed -i '/^URIs:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            # Ubuntu hosts arm64 packages on ports.ubuntu.com, not the default
            # archive/security mirrors — without these sources apt sees no arm64
            # packages at all (404 on binary-arm64 → "Unable to locate ...:arm64").
            printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ %s main universe multiverse restricted\n' \
              noble noble-updates noble-security \
              | sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null
          fi
          # apt-get update is flaky on GitHub runners — retry before giving up.
          for i in 1 2 3; do
            sudo apt-get update && break || { echo "apt-get update failed (attempt $i), retrying..."; sleep 10; }
          done
          if $CROSS; then
            # libc6 is Multi-Arch: same — both archs must sit at the SAME
            # version, so every :arm64 dev lib fails on a version-skewed libc6
            # ("held broken packages"). ports.ubuntu.com lags the archive/security
            # mirrors: the runner's security-updated amd64 libc6 is usually NEWER
            # than the arm64 one and the exact host version isn't in the arm64
            # repo. Install the arm64 flavor unpinned and let apt downgrade the
            # amd64 one to match (runner only hosts build tools, so a glibc
            # downgrade is harmless).
            sudo apt-get install -y --allow-downgrades libc6:arm64
            # Scoped pkg-config for the cross target. pkg-config uses the
            # <triple>-suffixed variants ONLY when probing for aarch64, so host
            # build-script deps (e.g. openssl-sys under a build script) still
            # resolve the host's OpenSSL instead of the arm64 one. A plain
            # global PKG_CONFIG_PATH leaked into host deps and made the host
            # linker reject arm64 libssl.so (elf64-x86-64 incompatible).
            # (cargo's [target.<triple>].env is not a real key — env must be
            # global — so these go through GITHUB_ENV.)
            echo "PKG_CONFIG_ALLOW_CROSS_aarch64_unknown_linux_gnu=1" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          fi
          HOST_PKGS="pkg-config gcc-aarch64-linux-gnu"
          # xcap 0.9 pulls libwayshot-xcap (Linux Wayland capture) which needs
          # EGL/GL and GBM, plus pipewire via libspa-sys. enigo 0.2's default
          # xdo backend links libxdo (xdotool). No audio crates in the tree, so
          # libasound2-dev stays out.
          LIBS="libssl-dev libwayland-dev libxkbcommon-dev libx11-dev \
                libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
                libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xkb-dev \
                libxrandr-dev libxi-dev libpipewire-0.3-dev \
                libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libxdo-dev"
          if $CROSS; then
            # Cross-compile: every dev lib must be the arm64 flavor so the
            # aarch64 toolchain finds matching headers/.pc files.
            CROSS_LIBS=""
            for lib in $LIBS; do CROSS_LIBS="$CROSS_LIBS $lib:arm64"; done
            sudo apt-get install -y $HOST_PKGS $CROSS_LIBS
          else
            sudo apt-get install -y $HOST_PKGS $LIBS
          fi
        env:
          DEBIAN_FRONTEND: noninteractive

      # Cross env for linux-arm64 (PKG_CONFIG_ALLOW_CROSS_<triple> /
      # PKG_CONFIG_PATH_<triple>) is set in "Install Linux build deps" above,
      # through GITHUB_ENV with the aarch64-unknown-linux-gnu triple suffix.
      # pkg-config only reads the <triple>-suffixed vars when probing for
      # aarch64, so host build-script deps (openssl-sys under ort-sys's build
      # script) still resolve the host's OpenSSL instead of the arm64 one — a
      # global PKG_CONFIG_PATH leaked the arm64 path into host deps and made
      # the host linker reject arm64 libssl.so (elf64-x86-64 incompatible).
      # (cargo's [target.<triple>].env is not a real key — env must be global —
      # which is why these go through GITHUB_ENV instead of .cargo/config.toml.)

      # aarch64-pc-windows-msvc needs the ARM64 MSVC LIB/INCLUDE paths so
      # lld-link can resolve the ARM64 CRT/import libs.
      - name: Setup ARM64 MSVC (win32-arm64)
        if: matrix.name == 'win32-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p nuphus-mcp
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Copy binary + native libs into platform package
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/nuphus-mcp
          if [ "${{ matrix.os }}" = "windows-latest" ]; then src="${src}.exe"; fi
          mkdir -p ${{ matrix.pkg_dir }}/bin
          cp "$src" ${{ matrix.pkg_dir }}/bin/
          for lib in ${{ matrix.native_libs }}; do
            cp "target/${{ matrix.target }}/release/$lib" ${{ matrix.pkg_dir }}/bin/
          done
          ls -la ${{ matrix.pkg_dir }}/bin/

      # Pack from the repo root with an absolute destination. A relative
      # --pack-destination failed on Windows when dist/ didn't exist yet
      # (npm 11 ENOENT), so create it first and use github.workspace.
      - name: npm pack platform package
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          npm pack --pack-destination "${{ github.workspace }}/dist" ./${{ matrix.pkg_dir }}

      - name: Copy raw binary for Release attachment
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/nuphus-mcp
          if [ "${{ matrix.os }}" = "windows-latest" ]; then src="${src}.exe"; fi
          mkdir -p dist/binary
          cp "$src" dist/binary/${{ matrix.artifact }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tgz
            dist/binary/*
          retention-days: 7

  publish:
    name: publish npm + GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish platform packages to npm
        working-directory: dist
        run: |
          for tgz in nuphus-mcp-*.tgz; do
            npm publish "$tgz" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NUPHUS_MCP_NPM }}

      # Pack the meta package to a SEPARATE dir so the glob above never
      # re-matches (and re-publishes) the platform tarballs.
      - name: Pack + publish meta package
        run: |
          npm pack --pack-destination dist-meta ./npm/packages/nuphus-mcp
          cd dist-meta
          npm publish nuphus-mcp-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NUPHUS_MCP_NPM }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/binary/*
          draft: false
          generate_release_notes: true
